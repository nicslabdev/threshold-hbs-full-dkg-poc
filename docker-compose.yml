services:
  party0:
    build: .
    hostname: party0
    networks:
      - mpc-net
    environment:
      - PARTY_ID=0
      - NUM_PARTIES=3
      - COORDINATOR_HOST=party0
      - N_STEPS=16
      - MODE=${MODE:-sequential}
      - N_COLS=${N_COLS:-4}
    volumes:
      - ./data/party0:/mpspdz/Player-Data
      - ./data/sync:/mpspdz/sync
    tty: true

  party1:
    build: .
    hostname: party1
    networks:
      - mpc-net
    environment:
      - PARTY_ID=1
      - NUM_PARTIES=3
      - COORDINATOR_HOST=party0
      - N_STEPS=16
      - MODE=${MODE:-sequential}
      - N_COLS=${N_COLS:-4}
    volumes:
      - ./data/party1:/mpspdz/Player-Data
      - ./data/sync:/mpspdz/sync
    depends_on:
      - party0
    tty: true

  party2:
    build: .
    hostname: party2
    networks:
      - mpc-net
    environment:
      - PARTY_ID=2
      - NUM_PARTIES=3
      - COORDINATOR_HOST=party0
      - N_STEPS=16
      - MODE=${MODE:-sequential}
      - N_COLS=${N_COLS:-4}
    volumes:
      - ./data/party2:/mpspdz/Player-Data
      - ./data/sync:/mpspdz/sync
    depends_on:
      - party0
    tty: true

networks:
  mpc-net:
    driver: bridge
